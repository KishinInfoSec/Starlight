{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>
<form class="card" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="form-field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <div class="actions">
        <button class="button" type="submit">Log in</button>
    </div>
    <p class="meta">No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</form>
{% endblock %}
